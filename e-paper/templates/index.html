<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermometer Dashboard</title>
    <link rel="icon" href="/static/favicon.ico" sizes="any">
    <link rel="icon" href="/static/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/static/favicon-16x16.png" type="image/png" sizes="16x16">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
        }
        h1 { text-align: center; margin-bottom: 8px; color: #2c3e50; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-size: 0.95em; }
        .chart-container {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .chart-title {
            font-size: 1.2em; font-weight: 600; margin-bottom: 15px;
            color: #34495e; text-align: center;
        }
        canvas { max-height: 350px; }
        .legend-custom {
            display: flex; justify-content: center; gap: 20px;
            margin-top: 10px; font-size: 0.85em;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .footer { text-align: center; color: #95a5a6; font-size: 0.85em; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Meteo Station Dashboard</h1>
    <p class="subtitle">Last 2 days &mdash; Internal and External Data</p>

    <div class="chart-container">
        <div class="chart-title">Temperature</div>
        <canvas id="tempChart"></canvas>
        <div class="legend-custom">
            <div class="legend-item"><span class="dot" style="background:#e74c3c"></span> Internal</div>
            <div class="legend-item"><span class="dot" style="background:#3498db"></span> External</div>
        </div>
    </div>

    <div class="chart-container">
        <div class="chart-title">Humidity</div>
        <canvas id="humChart"></canvas>
        <div class="legend-custom">
            <div class="legend-item"><span class="dot" style="background:#e74c3c"></span> Internal</div>
            <div class="legend-item"><span class="dot" style="background:#3498db"></span> External</div>
        </div>
    </div>

    <div class="footer">
        <span id="lastUpdate">Loading...</span>
    </div>

    <script>
        async function loadData() {
            const resp = await fetch("/api/readings");
            return resp.json();
        }

        function toDatasets(data, keys) {
            return keys.map(({key, label, color}) => ({
                label,
                data: data.map(d => ({
                    x: new Date(d.timestamp).getTime(),
                    y: (d[key] !== null && d[key] !== undefined) ? d[key] : null
                })),
                borderColor: color,
                backgroundColor: color.replace(')', ', 0.06)').replace('rgb', 'rgba'),
                borderWidth: 1,
                tension: 0.4,
                pointRadius: 0.5,
                pointHoverRadius: 2,
                pointBorderWidth: 0.5,
                fill: false,
                parsing: false
            }));
        }

        function formatXAxisTicks(value) {
            const d = new Date(value);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            if (d >= today) {
                return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            }
            return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ' +
                   d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        }

        function makeConfig(title, unit) {
            return {
                type: 'line',
                data: { datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    parsing: false,
                    scales: {
                        x: {
                            type: 'linear',
                            ticks: {
                                maxTicksLimit: 12,
                                callback: formatXAxisTicks
                            },
                            grid: { display: false }
                        },
                        y: {
                            title: { display: true, text: title },
                            grid: { color: '#ecf0f1' }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: '#fff',
                            titleColor: '#2c3e50',
                            bodyColor: '#333',
                            borderColor: '#ddd',
                            borderWidth: 1,
                            cornerRadius: 8,
                            callbacks: {
                                title: ctx => new Date(ctx[0].raw.x).toLocaleString(),
                                label: ctx => {
                                    if (ctx.raw.y === null) return '';
                                    return `${ctx.dataset.label}: ${ctx.raw.y.toFixed(1)}${unit}`;
                                }
                            }
                        }
                    },
                    elements: { point: { radius: 2, hoverRadius: 5 } }
                }
            };
        }

        async function init() {
            const data = await loadData();

            const tempKeys = [
                { key: 'internal_temp', label: 'Internal', color: 'rgb(231,76,60)' },
                { key: 'external_temp', label: 'External', color: 'rgb(52,152,219)' }
            ];
            const humKeys = [
                { key: 'internal_humidity', label: 'Internal', color: 'rgb(231,76,60)' },
                { key: 'external_humidity', label: 'External', color: 'rgb(52,152,219)' }
            ];

            const tempConfig = makeConfig('Temperature', '\u00b0C');
            tempConfig.data.datasets = toDatasets(data, tempKeys);
            new Chart(document.getElementById('tempChart'), tempConfig);

            const humConfig = makeConfig('Humidity', '%');
            humConfig.data.datasets = toDatasets(data, humKeys);
            new Chart(document.getElementById('humChart'), humConfig);

            document.getElementById('lastUpdate').textContent =
                'Last data point: ' + (data.length > 0
                    ? new Date(data[data.length - 1].timestamp).toLocaleString()
                    : 'No data yet');
        }

        init();
    </script>
</body>
</html>
